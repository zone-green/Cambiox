<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--sf:#fff;--ink:#0e1f1b;--mute:#5a6b66;--line:#d5dfdb;--acc:#00a383;--ai:#fff;--up:#0a8f4e;--dn:#d23c3c;--warn:#f2b134;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1512;--sf:#13221e;--ink:#e8f1ee;--mute:#92a69f;--line:#25382f;--acc:#2fd4ae;--ai:#04221a;--up:#3ddc8a;--dn:#ff7676;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1014;--sf:#1b1c21;--ink:#f1f2f4;--mute:#8d909a;--line:#2a2b32;--acc:#2fd4ae;--ai:#04221a;--up:#2fd47a;--dn:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif;line-height:1.45}
.w{max-width:560px;margin:0 auto;padding:0 16px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}.logo i{color:var(--acc);font-style:normal}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:22px}
h1{font-size:1.7rem;letter-spacing:-.03em;margin:0 0 6px;font-weight:800}
.mute{color:var(--mute);font-size:.88rem}
.tabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin:18px 0}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 .9rem Sora,sans-serif;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
label.f{display:block;font-size:.78rem;color:var(--mute);margin:12px 0 5px}
input{width:100%;font:500 1rem Sora,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:0}
input:focus{border-color:var(--acc)}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.eye[aria-pressed=true]{color:var(--acc)}
.btn{width:100%;border:0;background:var(--acc);color:var(--ai);font:800 1rem Sora,sans-serif;padding:15px;border-radius:14px;cursor:pointer;margin-top:18px}
button:focus-visible,input:focus-visible,.coin:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.err{color:var(--dn);font-size:.85rem;margin-top:10px;min-height:1.2em}
.hide{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:7px 12px;font:600 .8rem Sora,sans-serif;cursor:pointer}

.promo{background:var(--sf);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;font-size:.85rem;margin:6px 0 4px}
.list{list-style:none;margin:10px 0 40px;padding:0;display:grid;gap:10px}
.coin{display:flex;align-items:center;gap:14px;padding:16px;background:var(--sf);border:0;border-radius:16px;cursor:pointer;width:100%;color:inherit;font:inherit;text-align:left}
.av{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.25rem;flex:none}
.av svg{width:100%;height:100%;display:block}.av .bd{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;border:2px solid var(--sf);background:var(--sf);overflow:hidden}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:1.05rem;font-weight:600}.nm span{font-size:.92rem;color:var(--ink)}
.pr{text-align:right;font-weight:600;font-size:1.05rem}.pr span{display:block;font-size:.92rem;color:var(--mute);font-weight:400}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
select#flt{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 10px;font:600 .85rem Sora,sans-serif}
.empty{padding:28px;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{max-height:92vh;overflow:auto;background:var(--sf);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}

.sel{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:500 1rem Sora,sans-serif}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b-review{background:#f2b13426;color:var(--warn)}.b-done{background:#2fd47a26;color:var(--up)}.b-rejected{background:#ff5a5a26;color:var(--dn)}
.oc{background:var(--bg);border-radius:14px;padding:14px;margin-top:10px;font-size:.88rem}.oc.m{background:var(--sf)}
.oc .r{display:flex;justify-content:space-between;gap:12px;margin:4px 0}.oc .r span:first-child{color:var(--mute)}.oc .r span:last-child{text-align:right;word-break:break-all}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:10px;padding:11px;font:700 .85rem Sora,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);margin-top:8px}
.shot{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-top:8px;background:#000;cursor:zoom-in;display:block}
#af button{font-size:.78rem;padding:9px 2px}
.res{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.9rem}
.res div{display:flex;justify-content:space-between;padding:2px 0}
.order-mini{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:13px 15px;color:var(--ink);font:inherit;cursor:pointer}
.order-mini .om-left{min-width:0}.order-mini b{display:block;font-size:.92rem}.order-mini small{display:block;color:var(--mute);font-size:.75rem;margin-top:3px}
.order-mini .om-right{display:flex;align-items:center;gap:8px;flex:none}.order-mini .chev{color:var(--mute);font-size:1.2rem}
.admin-order{position:relative}.kebab{border:0;background:var(--sf);color:var(--mute);font-size:1.35rem;line-height:1;border-radius:9px;width:34px;height:32px;cursor:pointer}
.kmenu{position:absolute;right:8px;top:42px;z-index:8;background:var(--sf);border:1px solid var(--line);box-shadow:0 8px 25px #0005;border-radius:12px;padding:5px;min-width:145px}
.kmenu button{display:block;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:10px;border-radius:8px;font:600 .82rem Sora,sans-serif}.kmenu button.danger{color:var(--dn)}
#orderdetail .sheet{max-height:78vh}
.secondary{width:100%;background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font:600 .88rem Sora,sans-serif;cursor:pointer}

/* Acceso y pantalla de carga Cambiox */
#auth{min-height:100svh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:34px 0!important}
#auth:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 15%,rgba(47,212,174,.19),transparent 48%),linear-gradient(155deg,#07130f,#101b18 55%,#08110e)}
#auth .logo{font-size:2rem;letter-spacing:-.07em;text-align:center;margin-bottom:24px!important;color:#f2fff9}
#auth .logo i{color:#35e0b5}
#auth .card{background:rgba(18,34,29,.92);border:1px solid rgba(65,220,180,.2);box-shadow:0 22px 70px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(16px);padding:25px 22px;border-radius:25px;color:#effaf5}
#auth .card h1{font-size:1.85rem}
#auth .card .mute{color:#a7bdb4}
#auth input{background:#0c1a15;border-color:#29443a;color:#f3fff9}
#auth .tabs{background:#0b1914}
#auth .tabs button[aria-selected=true]{background:#1b332a;color:#f4fff9;box-shadow:0 0 0 1px #315b4b}
#auth .btn{background:linear-gradient(110deg,#16a982,#35d9ad);color:#04251b;box-shadow:0 9px 24px rgba(24,190,145,.2);transition:transform .18s,filter .18s}
#auth .btn:active{transform:scale(.985)}
#auth .err{color:#ff8585}
#auth .card:after{content:"●  BTC     ●  ETH     ●  USDT     ●  SOL";display:block;text-align:center;color:#72968a;font-size:.66rem;letter-spacing:.12em;margin-top:19px;opacity:.8}
#loadscreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center, #17382c 0%,#0b1712 55%,#050b08 100%);color:#effff8;transition:opacity .35s ease,visibility .35s ease}
#loadscreen.off{opacity:0;visibility:hidden;pointer-events:none}
.loadbox{text-align:center;padding:28px;width:min(90vw,340px)}
.coinorbit{width:104px;height:104px;margin:0 auto 24px;position:relative;border:1px solid rgba(65,230,184,.25);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 45px rgba(30,210,158,.12),inset 0 0 30px rgba(30,210,158,.08)}
.coinorbit:before,.coinorbit:after{content:"";position:absolute;inset:9px;border:2px solid transparent;border-top-color:#42e4b7;border-right-color:#42e4b7;border-radius:50%;animation:spin 1.25s linear infinite}
.coinorbit:after{inset:-6px;border-top-color:rgba(66,228,183,.35);border-right-color:transparent;animation-duration:2.1s;animation-direction:reverse}
.coincore{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2be0ae,#087d61);color:#05251b;font-size:1.8rem;font-weight:800;box-shadow:0 0 28px rgba(47,212,174,.35);animation:pulse 1.5s ease-in-out infinite}
.loadbrand{font-size:1.75rem;font-weight:800;letter-spacing:-.06em}.loadbrand span{color:#42e4b7}
.loadlabel{color:#9bb9ad;font-size:.82rem;margin-top:9px;letter-spacing:.12em;text-transform:uppercase}
.loadline{height:3px;background:#1b382d;border-radius:9px;overflow:hidden;margin:22px auto 0;width:180px}
.loadline i{display:block;height:100%;width:40%;border-radius:9px;background:#42e4b7;animation:loadingbar 1.25s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.15)}}@keyframes loadingbar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){.coinorbit:before,.coinorbit:after,.coincore,.loadline i{animation:none}}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>
<div id="loadscreen" aria-live="polite" aria-label="Cargando Cambiox"><div class="loadbox"><div class="coinorbit"><div class="coincore">₿</div></div><div class="loadbrand">Cambiox<span>.</span></div><div class="loadlabel" id="loadlabel">Preparando tu espacio cripto</div><div class="loadline"><i></i></div></div></div>

<div class="w">

<!-- APP -->

<script>
const RAW=`USDT|Tether (BEP20)|0.9991|0,BNB|BNB|689.69|0.48,BTC|Bitcoin|75046.4|0.62,TRX|Tron|0.317|-0.85,USDT|Tether (TRC20)|0.9991|0`;
const COINS=RAW.split(",").map(r=>{const[s,n,p,c]=r.split("|");return{s,n,p:+p,c:+c}});
const $=id=>document.getElementById(id);
const loading=(show,label)=>{const el=$("loadscreen");if(!el)return;$("loadlabel").textContent=label||"Cargando Cambiox";el.classList.toggle("off",!show)};
window.addEventListener("load",()=>setTimeout(()=>loading(false),950));
const fmt=(v,d)=>v.toLocaleString("es",{maximumFractionDigits:d??(v<0.01?8:v<1?4:2),minimumFractionDigits:d===undefined&&v>=1?2:0});
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
document.documentElement.dataset.theme="dark";
// ===== CONFIGURA AQUÍ (Supabase > Project Settings > API) =====
const SUPABASE_URL="https://ipygebuwqcwhuqdyblnn.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fhyEiq8Lt7BY5JOLApv8Gw_SozqiTU6";
// ================================================================
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const NO_CFG=SUPABASE_URL.includes("TU-PROYECTO");
let tab="in",user=null,cur=null,op="buy";
const wn=()=>{try{const o=JSON.parse(window.name);return o&&typeof o==="object"?o:{}}catch(e){return {}}};
const store={
  get(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}
    if(v==null){try{v=sessionStorage.getItem(k)}catch(e){}}
    if(v==null&&k==="cx_ses")v=wn()[k]??null;
    try{return v==null?null:JSON.parse(v)}catch(e){return null}},
  set(k,v){const j=JSON.stringify(v);try{localStorage.setItem(k,j)}catch(e){}try{sessionStorage.setItem(k,j)}catch(e){}
    if(k==="cx_ses"){const w=wn();w[k]=j;try{window.name=JSON.stringify(w)}catch(e){}}}
};
let mem={accounts:{},session:null};
const getAcc=()=>store.get("cx_acc")||mem.accounts, setAcc=a=>{mem.accounts=a;store.set("cx_acc",a)};
async function hash(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

const EYE='<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',EYEOFF='<path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.5 19 2 12 2 12a18 18 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M3 3l18 18"/>';
$("eye").onclick=()=>{const show=$("pass").type==="password";$("pass").type=show?"text":"password";$("eye").setAttribute("aria-pressed",show);$("eye").setAttribute("aria-label",show?"Ocultar contraseña":"Mostrar contraseña");$("eyei").innerHTML=show?EYEOFF:EYE};
document.querySelectorAll("#auth .tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll("#auth .tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("fn").classList.toggle("hide",tab==="in");$("fp").classList.toggle("hide",tab==="in");
  $("submit").textContent=tab==="in"?"Entrar":"Crear cuenta";$("err").textContent="";
});
const toUser=u=>({id:u.id,email:(u.email||"").toLowerCase(),name:u.user_metadata?.name||(u.email||"").split("@")[0],promo:(u.user_metadata?.promo||"").toUpperCase()});
const authMsg=e=>{const m=String(e?.message||e);

const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isAdmin=()=>!!user&&ADMIN_EMAILS.includes(user.email);
const fdate=t=>new Date(t).toLocaleString("es",{dateStyle:"short",timeStyle:"short"});
let af="all";
function detailBody(o,admin){
  const rows=[["De",o.from],["Recibe",o.to],o.phone&&["Teléfono",o.phone],o.wallet&&["Billetera",o.wallet],o.ref&&["Referencia",o.ref],admin&&["Cliente",o.name+" · "+o.email]].filter(Boolean);
  return `<h1 style="font-size:1.25rem;margin:6px 0 12px">${esc(o.label)} · ${fdate(o.t)}</h1><div class="r" style="margin-bottom:10px"><span class="badge b-${o.status}">${ST[o.status]}</span></div>`+
    rows.map(r=>`<div class="r" style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)"><span class="mute">${r[0]}</span><span style="text-align:right;word-break:break-all">${esc(r[1])}</span></div>`).join("")+
    (admin&&o.shot?`<img class="shot" src="${o.shot}" alt="Comprobante adjunto">`:"")+
    (!admin?`<p class="mute" style="margin-top:14px">${o.status==="review"?"Tu pedido está en revisión.":o.status==="done"?"El pedido figura como completado. Comprueba el estado por los canales oficiales antes de darlo por recibido.":"El pedido figura como rechazado. Consulta con soporte si necesitas aclaraciones."}</p><button class="secondary" style="margin-top:12px" data-hide-order="${esc(o.id)}">Ocultar de mi historial</button>`:"");
}
function card(o,admin){
  if(!admin)return `<button class="order-mini" data-open-order="${esc(o.id)}"><span class="om-left"><b>${esc(o.label)} · ${fdate(o.t)}</b><small>${esc(o.from)} → ${esc(o.to)}</small></span><span class="om-right"><span class="badge b-${o.status}">${ST[o.status]}</span><span class="chev">›</span></span></button>`;
  const rows=[["De",o.from],["Recibe",o.to],o.phone&&["Teléfono",o.phone],o.wallet&&["Billetera",o.wallet],o.ref&&["Referencia",o.ref],["Cliente",o.name+" · "+o.email]].filter(Boolean);
  return `<div class="oc admin-order"><div class="r"><b>${esc(o.label)} · ${fdate(o.t)}</b><span style="display:flex;align-items:center;gap:7px"><span class="badge b-${o.status}">${ST[o.status]}</span><button class="kebab" aria-label="Opciones" data-menu="${esc(o.id)}">⋮</button></span></div><div class="kmenu hide" id="km-${esc(o.id)}"><button data-action="archive" data-id="${esc(o.id)}">${o.archived?"Desarchivar":"Archivar"}</button><button class="danger" data-action="delete" data-id="${esc(o.id)}">Eliminar definitivamente</button></div>`+
    rows.map(r=>`<div class="r"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join("")+
    (o.shot?`<img class="shot" src="${o.shot}" alt="Comprobante adjunto">`:"")+
    (o.status==="review"?`<div class="acts"><button style="background:var(--up);color:#04221a" data-id="${esc(o.id)}" data-s="done">Aprobar</button><button style="background:var(--dn);color:#fff" data-id="${esc(o.id)}" data-s="rejected">Rechazar</button></div>`:"")+`</div>`;
}
function memberCard(m,n){return `<div class="oc"><div class="r"><b>${esc(m.name)}</b><span class="badge b-done">${n} pedidos</span></div><div class="r"><span>Correo</span><span>${esc(m.email)}</span></div><div class="r"><span>Código</span><span>${esc(m.promo||"—")}</span></div><div class="r"><span>Registro</span><span>${m.t?fdate(m.t):"—"}</span></div></div>`}
let busy=false;
async function refreshOrders(){
  if(!user||busy)return;busy=true;
  try{
    const all=await getOrders();window.__orders=all;
    const hiddenIds=isAdmin()?new Set():await getHiddenOrderIds();
    const mine=all.filter(o=>o.email===user.email&&!o.archived&&!hiddenIds.has(String(o.id))).slice(0,5),pend=all.filter(o=>o.status==="review"&&!o.archived).length,adm=isAdmin();
    $("mine").innerHTML=mine.length?`<div class="mute" style="margin:8px 0 0">Mis pedidos</div><div style="display:grid;gap:9px;margin-top:9px">`+mine.map(o=>card(o,false)).join("")+`</div>`:"";
    $("adm").classList.toggle("hide",!adm);$("adm").textContent="Panel"+(pend?` (${pend})`:"");
    if(adm){
      const {data}=await sb.from("profiles").select("*").order("created_at",{ascending:false}),accs=(data||[]).map(m=>({...m,t:m.created_at}));
      $("amem").textContent="Miembros ("+accs.length+")";
      if(!$ ("adv").classList.contains("hide")){
        if(af==="members")$("ol").innerHTML=accs.length?accs.map(m=>memberCard(m,all.filter(o=>o.email===m.email).length)).join(""):`<div class="empty">Aún no hay miembros.</div>`;
        else{let l=all.filter(o=>af==="archived"?o.archived:!o.archived&&(af==="all"||o.status===af));for(const o of l)o.shot=await proofUrl(o.proof);$("ol").innerHTML=l.length?l.map(o=>card(o,true)).join(""):`<div class="empty">No hay pedidos.</div>`}
      }
    }
  }catch(e){console.error(e)}finally{busy=false}
}
$("adm").onclick=()=>{$("adv").classList.remove("hide");refreshOrders()};
$("adc").onclick=()=>$("adv").classList.add("hide");
$("lb").onclick=()=>$("lb").classList.add("hide");
$("adv").onclick=e=>{
  if(e.target===$("adv"))$("adv").classList.add("hide");
  const im=e.target.closest(".shot");if(im){$("lbi").src=im.src;$("lb").classList.remove("hide");return}
  const menu=e.target.closest("[data-menu]");if(menu){const id=menu.dataset.menu;document.querySelectorAll(".kmenu").forEach(x=>x.classList.add("hide"));$("km-"+id).classList.toggle("hide");return}
  const action=e.target.closest("[data-action]");if(action){const id=action.dataset.id,kind=action.dataset.action;const current=window.__orders?.find(o=>String(o.id)===String(id));if(kind==="delete"&&!confirm("¿Eliminar este pedido definitivamente? Esta acción no se puede deshacer."))return;const task=kind==="archive"?setArchived(id,!current?.archived):deleteOrder(id);task.then(refreshOrders).catch(err=>{console.error(err);alert("No se pudo realizar la acción. Comprueba los permisos de Supabase.")});return}
  const b=e.target.closest("[data-id][data-s]");if(b)setStatus(b.dataset.id,b.dataset.s).then(refreshOrders).catch(()=>alert("No se pudo actualizar el pedido."));
};
$("mine").onclick=e=>{const b=e.target.closest("[data-open-order]");if(!b)return;const o=window.__orders?.find(x=>String(x.id)===String(b.dataset.openOrder));if(!o)return;$("odbody").innerHTML=detailBody(o,false);$("orderdetail").classList.remove("hide")};
$("odbody").onclick=async e=>{
  const b=e.target.closest("[data-hide-order]");if(!b)return;
  if(!confirm("¿Ocultar este pedido de tu historial? El pedido no se eliminará de la base de datos."))return;
  b.disabled=true;
  try{$("orderdetail").classList.add("hide");await hideOrder(b.dataset.hideOrder);await refreshOrders()}
  catch(err){console.error(err);b.disabled=false;alert("No se pudo ocultar el pedido. Comprueba los permisos de Supabase.")}
};
$("odc").onclick=()=>$("orderdetail").classList.add("hide");
$("orderdetail").onclick=e=>{if(e.target===$("orderdetail"))$("orderdetail").classList.add("hide")};
document.querySelectorAll("#af button").forEach(b=>b.onclick=()=>{af=b.dataset.s;document.querySelectorAll("#af button").forEach(x=>x.setAttribute("aria-selected",x===b));refreshOrders()});
sb.channel("orders-live").on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>refreshOrders()).subscribe();
setInterval(refreshOrders,20000);
// Sesión: se restaura sola al actualizar; solo se cierra con "Salir"
const cached=store.get("cx_ses");if(cached)start(cached);
sb.auth.getSession().then(({data,error})=>{
  if(data&&data.session)start(toUser(data.session.user));
  else if(!error&&cached)showLogin();
});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&user)showLogin()});
</script>
</body>
</html>
